# npm Trusted Publishing allows only ONE workflow filename per package.
#
# Configure on npmjs.com → effectable → Settings → Trusted Publisher:
#   Organization/user: iamnikas
#   Repository:        effectable
#   Workflow filename: publish.yml
#   Environment:       leave empty
#
# Version bumps + publish are driven by semantic-release from Conventional Commits
# (same convention enforced by commitlint).

name: Publish

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          # Do not set registry-url: it breaks npm Trusted Publishing (OIDC).
          package-manager-cache: false

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Build
        run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
        run: npx semantic-release
